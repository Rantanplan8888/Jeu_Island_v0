[build]
  command = "npm run build"
  publish = "app/dist"
  # Économie de crédits Netlify : pas de nouvelle mise en ligne si rien n'a changé dans ce qui compose l'appli
  # (une modif du serveur Supabase, des scripts d'admin ou de la doc ne coûte donc rien).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- app engine package.json package-lock.json netlify.toml"

[build.environment]
  NODE_VERSION = "22"

# Aucune connexion extérieure : le navigateur refuse tout autre site que celui-ci.
# Seule exception : le projet Supabase d'Island (connect-src).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://zodxkoiuvewnpzcjtbiu.supabase.co; manifest-src 'self'; worker-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
