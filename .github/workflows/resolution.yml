name: Résolution quotidienne

# Chaque tour se termine à minuit, heure de Paris. Ce workflow passe juste après minuit
# (22 h 05 UTC en été, 23 h 05 UTC en hiver) et résout les parties dont l'échéance est passée.
# Si tous les joueurs se déclarent prêts avant, le tour est résolu tout de suite par l'appli.
# GitHub peut décaler l'exécution de quelques minutes.
on:
  schedule:
    - cron: '5 22 * * *'
    - cron: '5 23 * * *'
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Résoudre les tours
        run: |
          curl --fail-with-body -sS -X POST \
            "https://zodxkoiuvewnpzcjtbiu.supabase.co/functions/v1/game" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"action":"resolve-due"}'
