name: Mettre en ligne (GitHub Pages)

# Publie l'appli sur https://rantanplan8888.github.io/jeu_island_v0/ à chaque changement de l'appli sur main.
# Prérequis (une fois) : Settings > Pages > Source = « GitHub Actions ».
on:
  push:
    branches: [main]
    paths: ['app/**', 'engine/**', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Pas de redirections sur GitHub Pages : toute adresse inconnue renvoie l'appli.
      - run: cp app/dist/index.html app/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
