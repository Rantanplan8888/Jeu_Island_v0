name: Déployer Supabase

# Applique les migrations et déploie la fonction serveur à chaque modification sur main.
on:
  push:
    branches: [main]
    paths: ['supabase/**', 'engine/src/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency: deploy-supabase

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: zodxkoiuvewnpzcjtbiu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Lier le projet
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Appliquer les migrations
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD"
      - name: Copier le moteur de règles dans la fonction
        run: mkdir -p supabase/functions/_shared && cp -r engine/src supabase/functions/_shared/engine
      - name: Secret de la tâche du matin
        run: supabase secrets set CRON_SECRET="${{ secrets.CRON_SECRET }}" --project-ref "$PROJECT_REF"
      - name: Déployer la fonction
        run: supabase functions deploy game --project-ref "$PROJECT_REF" --no-verify-jwt
